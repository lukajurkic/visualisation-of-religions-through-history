<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive World Map</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/style_continents_section.css" />
  <link rel="stylesheet" href="css/style_countries_section.css" />
  <link rel="stylesheet" href="css/year_slider.css" />
  <link rel="stylesheet" href="css/popup_global_data.css" />
  <link rel="stylesheet" href="css/infobox.css" />
  <link rel="stylesheet" href="css/graph_area_national.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div style="text-align: center; margin-top: 20px;">
    <h1>Religious Division in the Past</h1>
    <div class="menu">
      <div class="dropdown">
        <a href="#">Link 1</a>
        <div class="dropdown-content">
          <a href="#section1">Link 1.1</a>
          <a href="#section2">Link 1.2</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="#">Link 2</a>
        <div class="dropdown-content">
          <a href="#section3">Link 2.1</a>
          <a href="#section4">Link 2.2</a>
        </div>
      </div>
      <div>
        <a href="#" id="show-data-btn">Link 3</a>
      </div>
    </div>
  </div>
  
  <!-- Sections with subtitles -->
  <div class="container" style="margin: 20px;">
    <h2 id="selected-year">Year: 1945</h2>
    <div class="slider-container">
    <input type="range" id="year-slider">
    <div id="selected-year"></div>
  </div>

    <section id="section1">
      <h2 style="text-align: center;">Section 1</h2>
      <div class="section1-container" style="display: flex; justify-content: space-between;">
        <div class="map-container">
          <div id="info-box-countries">Select a country</div>
          <svg id="map-countries" style="border: 2px solid #999;"></svg>
          <button id="reset-btn-countries" style="display:none;">Back to World View</button>
        </div>
        <div class="graph-container">
          <h3 style="text-align: center;">Country Data Visualization</h3>
          <svg id="graph-countries"></svg>
        </div>
      </div>
    </section>

    <section id="section2">
      <h2 style="text-align: center;">Section 2</h2>
      <div class="section2-container" style="display: flex; justify-content: space-between;">
        <div class="graph-container">
            <h3 style="text-align: center;">Continent Data Visualization</h3>
            <svg id="graph-continents"></svg>
        </div>
        <div class="map-container">
          <div id="info-box-continents">Select a continent</div>
          <svg id="map-continents" style="border: 2px solid #999;"></svg>
          <button id="reset-btn-continents" style="display:none;">Back to World View</button>
        </div>
      </div>
      
    </section>

    <section id="section3">
      <h2 style="text-align: center;">Section 3</h2>
    </section>
    <section id="section4">
      <h2 style="text-align: center;">Section 4</h2>
    </section>
  </div>
  <div id="popup"></div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/button.js"></script>
  <script type="module" src="js/national_graph.js"></script>
</body>
</html>
