<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive World Map</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/toggle_switch.css" />
  <link rel="stylesheet" href="css/reset_button.css" />
  <link rel="stylesheet" href="css/year_slider.css" />
  <link rel="stylesheet" href="css/show_data_button.css" />
  <link rel="stylesheet" href="css/popup_global_data.css" />
  <link rel="stylesheet" href="css/infobox.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div style="text-align: center; margin-top: 20px;">
    <h1>Religious Division in the Past</h1>
  </div>
  <div class="container">
    <div id="map-container">
      <div id="info-box">Select a country</div>
      <svg id="map"></svg>
    </div>
    <div id="sidebar">
      <div id="controls">
        <h2 id="selected-year">Year: 1945</h2>
        <input type="range" id="year-slider" min="1945" max="2010" step="5" value="1945" />
        <br /><br />
        <button id="reset-btn" style="display:none;">Back to the World view</button>
        <div id="view-toggle">
          <label for="map-view-switch">Map View: </label>
          <label class="switch">
            <input type="checkbox" id="map-view-switch" checked>
            <span class="slider round"></span>
          </label>
          <span id="view-label">Countries</span>
        </div>
      </div>
      <button id="show-data-btn">Show Gloabal Data</button>
      <div style="margin-top: 10px;">
        <select id="religion-dropdown">
          <option value="">Select a Religion</option>
          <option value="chrstprot">Christianity Protestants</option>
          <option value="chrstcat">Christianity Roman Catholics</option>
          <option value="chrstorth">Christianity Eastern Orthodox</option>
          <option value="chrstang">Christianity Anglican</option>
          <option value="chrstothr">Christianity Others</option>
          <option value="judorth">Judaism Orthodox</option>
          <option value="jdcons">Judaism Conservatives</option>
          <option value="judref">Judaism Reform</option>
          <option value="judothr">Judaism Others</option>
          <option value="islmsun">Islam Sunni</option>
          <option value="islmshi">Islam Shia</option>
          <option value="islmibd">Islam Ibadi</option>
          <option value="islmnat">Islam Nation of Islam</option>
          <option value="islmalw">Islam Alawite</option>
          <option value="islmahm">Islam Ahmadiyya</option>
          <option value="islmothr">Islam Other</option>
          <option value="budmah">Buddhism Mahayana</option>
          <option value="budthr">Buddhism Theravada</option>
          <option value="budothr">Buddhism Other</option>
          <option value="zorogen">Zoroastrian Total</option>
          <option value="hindgen">Hindu Total</option>
          <option value="sikhgen">Sikh Total</option>
          <option value="shntgen">Shinto Total</option>
          <option value="bahgen">Baha'i Total</option>
          <option value="taogen">Taoism Total</option>
          <option value="jaingen">Jain Total</option>
          <option value="confgen">Confucianism Total</option>
          <option value="syncgen">Syncretic Religions Total</option>
          <option value="anmgen">Animist Religions Total</option>
          <option value="nonrelig">Non Religious Total</option>
          <option value="othrgen">Other Religions Total</option>
        </select>
      </div>
    </div>
  </div>
  <div id="popup"></div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/button.js"></script>
  <script type="module" src="js/regionalData.js"></script>
  <script type="module" src="js/nationalData.js"></script>
</body>
</html>
